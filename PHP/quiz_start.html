<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Quiz - Quiz App</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .quiz-info {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .quiz-options {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .option-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option-card:hover {
            border-color: #667eea;
            background: #f0f2ff;
            transform: translateY(-2px);
        }
        
        .option-card.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .option-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .option-desc {
            font-size: 14px;
            color: inherit;
            opacity: 0.8;
        }
        
        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
        }
        
        .start-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">← Back to Dashboard</a>
        </header>
        
        <h1>Start New Quiz</h1>
        <div class="quiz-info">
            <p>Select quiz type and start testing your knowledge!</p>
        </div>
        
        <div class="quiz-options">
            <div class="option-card" onclick="selectOption(this)" data-questions="10">
                <div class="option-title">Quick Quiz (10 Questions)</div>
                <div class="option-desc">Perfect for a quick knowledge check</div>
            </div>
            
            <div class="option-card" onclick="selectOption(this)" data-questions="20">
                <div class="option-title">Standard Quiz (20 Questions)</div>
                <div class="option-desc">Comprehensive test of your knowledge</div>
            </div>
            
            <div class="option-card" onclick="selectOption(this)" data-questions="30">
                <div class="option-title">Full Quiz (30 Questions)</div>
                <div class="option-desc">Complete assessment of your skills</div>
            </div>
        </div>
        
        <button class="start-btn" id="startBtn" disabled onclick="startQuiz()">Start Quiz</button>
    </div>

    <script>
        let selectedQuestions = 0;
        
        function selectOption(element) {
            // Remove selected class from all options
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Add selected class to clicked option
            element.classList.add('selected');
            
            // Get number of questions
            selectedQuestions = parseInt(element.getAttribute('data-questions'));
            
            // Enable start button
            document.getElementById('startBtn').disabled = false;
        }
        
        function startQuiz() {
            if (selectedQuestions === 0) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Please select a quiz type'
                });
                return;
            }
            
            Swal.fire({
                title: 'Starting Quiz',
                text: `Get ready for ${selectedQuestions} questions!`,
                icon: 'info',
                showCancelButton: true,
                confirmButtonText: 'Start Now',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Redirect to quiz page with question count
                    window.location.href = `quiz.html?questions=${selectedQuestions}`;
                }
            });
        }
    </script>
</body>
</html>
